<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SmartAI Mobile Camera</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #05070c;
        --card: rgba(10, 20, 29, 0.72);
        --card-strong: rgba(10, 20, 29, 0.88);
        --text: #f2f7ff;
        --muted: rgba(242, 247, 255, 0.64);
        --border: rgba(98, 176, 206, 0.18);
        --accent: #4bd4ff;
        --accent-strong: #ffb35c;
        --ok: #10b981;
        --warn: #ffb35c;
        --shadow: 0 30px 90px rgba(0, 0, 0, 0.55);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 10% 20%, rgba(75, 212, 255, 0.2), transparent 35%),
          radial-gradient(circle at 85% 15%, rgba(255, 179, 92, 0.18), transparent 32%),
          radial-gradient(circle at 42% 85%, rgba(168, 85, 247, 0.14), transparent 40%),
          linear-gradient(180deg, var(--bg), #03040a);
        color: var(--text);
        font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        width: min(560px, 100%);
        background:
          linear-gradient(180deg, var(--card-strong), var(--card)),
          linear-gradient(135deg, rgba(75, 212, 255, 0.06), transparent 45%);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(22px);
        padding: 18px 18px 16px;
      }
      h1 {
        margin: 0 0 10px 0;
        font-size: 1.28rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 6px 0;
      }
      .muted {
        color: var(--muted);
      }
      .status {
        font-weight: 600;
      }
      .status.ok {
        color: var(--ok);
      }
      .status.warn {
        color: var(--warn);
      }
      .panel {
        background: rgba(6, 16, 24, 0.62);
        border: 1px solid rgba(98, 176, 206, 0.14);
        border-radius: 16px;
        padding: 10px;
        margin-top: 12px;
      }
      video,
      canvas {
        width: 100%;
        border-radius: 16px;
        background: #0d1117;
        border: 1px solid rgba(98, 176, 206, 0.12);
      }
      canvas {
        display: none;
      }
      .actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
        flex-wrap: wrap;
      }
      button {
        border: 1px solid rgba(98, 176, 206, 0.16);
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-strong));
        color: #071018;
        padding: 10px 14px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      }
      button.secondary {
        background: rgba(6, 16, 24, 0.62);
        color: var(--text);
      }
      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 16px 34px rgba(0, 0, 0, 0.35);
        border-color: rgba(75, 212, 255, 0.28);
      }
      button:focus-visible {
        outline: none;
        box-shadow: 0 0 0 4px rgba(75, 212, 255, 0.14);
      }
      .file-capture {
        margin-top: 12px;
        display: none;
      }
      .file-capture input {
        width: 100%;
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.82rem;
        word-break: break-all;
      }

      @media (max-width: 520px) {
        body {
          padding: 14px;
        }
        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>SmartAI Mobile Camera Bridge</h1>
      <p class="muted">Device: <strong>{{ device_id }}</strong></p>
      <p id="status" class="status warn">Waiting to start stream...</p>

      <section class="panel">
        <video id="preview" autoplay muted playsinline></video>
        <canvas id="capture-canvas"></canvas>
      </section>

      <div class="actions">
        <button id="start-btn" type="button">Start streaming</button>
        <button id="stop-btn" type="button" class="secondary">Stop</button>
      </div>

      <section class="panel file-capture" id="file-capture">
        <p class="muted">Camera API unavailable in this browser context. Use manual camera capture fallback:</p>
        <input id="photo-input" type="file" accept="image/*" capture="environment" />
      </section>

      <section class="panel">
        <p class="muted">Stream URL</p>
        <p class="mono">{{ mobile_page_url }}</p>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
      const uploadUrl = "{{ mobile_upload_url }}";
      const deviceId = "{{ device_id }}";
      const uploadIntervalMs = Number("{{ upload_interval_ms }}") || 350;

      const statusEl = document.getElementById("status");
      const previewEl = document.getElementById("preview");
      const canvasEl = document.getElementById("capture-canvas");
      const fileCaptureEl = document.getElementById("file-capture");
      const fileInputEl = document.getElementById("photo-input");

      let stream = null;
      let timer = null;
      let sending = false;

      function setStatus(text, kind = "warn") {
        statusEl.textContent = text;
        statusEl.classList.remove("ok", "warn");
        statusEl.classList.add(kind);
      }

      async function sendFrame(dataUrl) {
        if (sending) return;
        sending = true;
        try {
          const response = await fetch(uploadUrl, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image: dataUrl,
              device_id: deviceId,
            }),
          });
          if (!response.ok) {
            const payload = await response.json().catch(() => null);
            throw new Error(payload?.error || `Upload failed (${response.status})`);
          }
          setStatus("Streaming to SmartAI backend", "ok");
        } catch (error) {
          setStatus(error.message || "Upload failed", "warn");
        } finally {
          sending = false;
        }
      }

      function startUploading() {
        if (timer) clearInterval(timer);
        timer = window.setInterval(() => {
          if (!previewEl.videoWidth || !previewEl.videoHeight) return;
          canvasEl.width = previewEl.videoWidth;
          canvasEl.height = previewEl.videoHeight;
          const ctx = canvasEl.getContext("2d");
          if (!ctx) return;
          ctx.drawImage(previewEl, 0, 0, canvasEl.width, canvasEl.height);
          const dataUrl = canvasEl.toDataURL("image/jpeg", 0.72);
          sendFrame(dataUrl);
        }, uploadIntervalMs);
      }

      async function startStream() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          fileCaptureEl.style.display = "block";
          setStatus("Live stream unavailable. Use manual capture fallback.", "warn");
          return;
        }

        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: "environment" },
              width: { ideal: 1280 },
              height: { ideal: 720 },
            },
            audio: false,
          });
          previewEl.srcObject = stream;
          startUploading();
          setStatus("Camera connected. Sending frames...", "ok");
        } catch (error) {
          fileCaptureEl.style.display = "block";
          setStatus("Camera permission denied or insecure context", "warn");
        }
      }

      function stopStream() {
        if (timer) {
          clearInterval(timer);
          timer = null;
        }
        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
          stream = null;
        }
        previewEl.srcObject = null;
        setStatus("Streaming stopped", "warn");
      }

      document.getElementById("start-btn").addEventListener("click", startStream);
      document.getElementById("stop-btn").addEventListener("click", stopStream);
      fileInputEl.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          const result = reader.result;
          if (!result || typeof result !== "string") return;
          await sendFrame(result);
        };
        reader.readAsDataURL(file);
      });

      window.addEventListener("beforeunload", stopStream);
      });
    </script>
  </body>
</html>
